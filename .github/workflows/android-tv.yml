name: Android TV app
on:
  push:
    branches: [main]
    paths:
      - "android-tv/**"
      - ".github/workflows/android-tv.yml"
  pull_request:
    paths:
      - "android-tv/**"
      - ".github/workflows/android-tv.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-tv-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # The permanent signing key (repository secrets): an update installs over
      # the app already on the TV only when it is signed with the same key.
      - name: Signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.UMBRA_TV_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::UMBRA_TV_KEYSTORE_BASE64 is not a repository secret: the APK is signed with a throwaway key and is not released."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/umbra-tv.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the APK
        working-directory: android-tv
        env:
          UMBRA_TV_KEYSTORE: ${{ steps.key.outputs.signed == 'true' && format('{0}/umbra-tv.jks', runner.temp) || '' }}
          UMBRA_TV_KEYSTORE_PASSWORD: ${{ secrets.UMBRA_TV_KEYSTORE_PASSWORD }}
          UMBRA_TV_KEY_ALIAS: umbra-tv
          UMBRA_TV_KEY_PASSWORD: ${{ secrets.UMBRA_TV_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/umbra-tv.apk"
          ls -l "$RUNNER_TEMP/umbra-tv.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: umbra-tv
          path: ${{ runner.temp }}/umbra-tv.apk
    outputs:
      signed: ${{ steps.key.outputs.signed }}

  # On main, with the permanent key: a release whose umbra-tv.apk is always at
  # https://github.com/<repo>/releases/latest/download/umbra-tv.apk (Downloader).
  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.build.outputs.signed == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: umbra-tv
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: tv-1.0.${{ github.run_number }}
        run: |
          gh release create "$TAG" umbra-tv.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Umbra для Android TV 1.0.${{ github.run_number }}" \
            --notes "Установка на телевизоре: Downloader → https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/umbra-tv.apk" \
            --latest
          {
            echo "### Umbra для Android TV"
            echo "Ссылка для Downloader: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/umbra-tv.apk"
          } >> "$GITHUB_STEP_SUMMARY"
