name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'assets/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Publish assets for branch Pages
        run: |
          mkdir -p assets
          cp -f dist/assets/index.js assets/index.js
          cp -f dist/assets/index.css assets/index.css
          cp -f dist/favicon.svg favicon.svg || true
          cp -f dist/icon.svg icon.svg || true
          git config user.name "umbra-pages"
          git config user.email "pages@users.noreply.github.com"
          git add assets favicon.svg icon.svg
          if git diff --staged --quiet; then
            echo "no asset changes"
          else
            git commit -m "Publish built assets for GitHub Pages"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
